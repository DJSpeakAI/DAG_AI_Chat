<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DAG AI Chat —— 气泡树式 AI 深度学习伙伴，支持 HarmonyOS 多端">
<title>DAG AI Chat · 气泡树 AI 深度学习伙伴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #120B1F 0%, #1E1236 55%, #2A1A4A 100%);
    color: #EDE9F7;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
    padding: 96px 24px 64px;
    text-align: center;
  }
  .logo {
    width: 84px; height: 84px;
    margin: 0 auto 28px;
    border-radius: 22px;
    background: linear-gradient(135deg, #7C5CFF 0%, #9F7BFF 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(124, 92, 255, 0.35);
  }
  .logo span { font-size: 38px; font-weight: 700; color: #FFFFFF; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: 1px; }
  .slogan {
    margin-top: 14px;
    font-size: 18px;
    color: #B9AEE0;
    letter-spacing: 2px;
  }
  .desc {
    margin: 36px auto 0;
    max-width: 560px;
    font-size: 15px;
    line-height: 1.9;
    color: #CFC6E8;
  }
  .features {
    margin-top: 56px;
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .feature {
    flex: 1 1 220px;
    max-width: 280px;
    padding: 28px 20px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .feature h2 { font-size: 17px; font-weight: 600; color: #E6DFFA; }
  .feature p { margin-top: 10px; font-size: 13px; line-height: 1.8; color: #A99BD4; }
  .soon {
    margin-top: 56px;
    font-size: 13px;
    color: #8A7CB8;
    letter-spacing: 1px;
  }
  footer {
    padding: 24px 16px 32px;
    text-align: center;
    font-size: 12px;
    color: #7E70AC;
    line-height: 2;
  }
  footer a { color: #9F8BD6; text-decoration: none; }
  footer a:hover { color: #C3B2F0; }
  @media (max-width: 600px) {
    main { padding-top: 64px; }
    h1 { font-size: 30px; }
    .slogan { font-size: 15px; }
  }
</style>
</head>
<body>
<main>
  <div class="logo"><span>D</span></div>
  <h1>DAG AI Chat</h1>
  <div class="slogan">气泡树 · AI 深度学习伙伴</div>
  <p class="desc">
    以气泡树组织每一次思考的对话学习工具：AI 对话随想延伸，
    生词与知识沉淀成库，科学复习稳步内化。支持 HarmonyOS 手机、平板与 PC 多端。
  </p>
  <div class="features">
    <div class="feature">
      <h2>气泡树对话</h2>
      <p>思维随对话分叉生长，话题脉络一目了然，支持多模型与深度思考。</p>
    </div>
    <div class="feature">
      <h2>词库与知识库</h2>
      <p>划词收录、卡片整理，图片与文档皆可提炼沉淀，学习资产随身携带。</p>
    </div>
    <div class="feature">
      <h2>科学复习</h2>
      <p>记忆算法排程，桌面卡片随时自测，让每一条记录真正留在长期记忆。</p>
    </div>
  </div>
  <div class="soon">应用上架筹备中 · HarmonyOS</div>
</main>

</body>
</html>
