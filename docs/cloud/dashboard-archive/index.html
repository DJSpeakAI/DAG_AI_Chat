<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAGAI 埋点看板</title>
<script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #17131f; color: #e8e2f5; font-family: 'Microsoft YaHei', sans-serif; padding: 16px 20px; }
  h1 { font-size: 18px; color: #b9a5ff; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .top .sub { color: #8a7fa8; font-size: 12px; }
  .btn { background: #2c2440; color: #cfc2f5; border: 1px solid #4a3d75; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  .btn.active { background: #6c4fe0; color: #fff; border-color: #8f78ec; }
  .card { background: #201a2e; border: 1px solid #342a52; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; color: #b9a5ff; margin-bottom: 10px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .shotwrap { position: relative; display: inline-block; max-width: 100%; }
  .shotwrap img { max-width: 100%; border-radius: 8px; display: block; }
  .mark { position: absolute; transform: translate(-50%, -50%); background: rgba(108,79,224,.92); border: 2px solid #b9a5ff;
          color: #fff; border-radius: 14px; padding: 3px 9px; font-size: 12px; cursor: pointer; white-space: nowrap;
          box-shadow: 0 0 10px rgba(108,79,224,.7); z-index: 2; }
  .mark small { opacity: .75; font-size: 10px; margin-right: 3px; }
  .mark.zero { background: rgba(90,80,120,.85); border-color: #7a6da0; box-shadow: none; }
  .controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  select { background: #2c2440; color: #cfc2f5; border: 1px solid #4a3d75; border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  .stat { display: inline-block; background: #2c2440; border-radius: 8px; padding: 8px 14px; margin-right: 8px; margin-bottom: 8px; }
  .stat b { color: #b9a5ff; font-size: 18px; margin-left: 6px; }
  #chart { width: 100%; height: 340px; }
  .hint { color: #8a7fa8; font-size: 11px; margin-top: 6px; }
  .empty { color: #8a7fa8; font-size: 12px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="top">
  <h1>DAGAI 埋点看板</h1>
  <span class="sub" id="meta"></span>
  <span style="flex:1"></span>
  <span class="sub">热区时间窗：</span>
  <button class="btn" data-win="day" onclick="setWin('day')">今天</button>
  <button class="btn" data-win="week" onclick="setWin('week')">近 7 天</button>
  <button class="btn" data-win="month" onclick="setWin('month')">近 30 天</button>
  <button class="btn active" data-win="all" onclick="setWin('all')">全部</button>
  <button class="btn" onclick="load()">刷新</button>
</div>

<div class="card">
  <h2>① App 界面热区还原（标注 = 被埋点按钮 · 数字 = 窗口内点击数 · 点击跳转图表）</h2>
  <div class="tabs" id="pageTabs"></div>
  <div id="shotArea" class="shotwrap"></div>
</div>

<div class="card">
  <h2>② 事件分布柱状图</h2>
  <div class="controls">
    <select id="eventSel" onchange="renderChart()"></select>
    <button class="btn active" data-g="hour" onclick="setGran('hour')">小时</button>
    <button class="btn" data-g="day" onclick="setGran('day')">天</button>
    <button class="btn" data-g="week" onclick="setGran('week')">周</button>
    <button class="btn" data-g="month" onclick="setGran('month')">月</button>
    <button class="btn" data-g="year" onclick="setGran('year')">年</button>
  </div>
  <div id="stats"></div>
  <div id="chart"></div>
  <div class="hint">带参数事件（如设置Tab、评分）按参数值分色堆叠；同参数含义见 docs/埋点字典.md</div>
</div>

<script>
let EVENTS = [], COORDS = { events: {}, pages: [] };
let curWin = 'all', curGran = 'day', curPage = 0, curEvent = '';
const chart = echarts.init(document.getElementById('chart'));

function ts(n) { const d = new Date(n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function winStart() {
  if (curWin === 'all') return 0;
  const days = curWin === 'day' ? 1 : (curWin === 'week' ? 7 : 30);
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (days - 1)); return d.getTime();
}
function count(ev, paramKey, paramVal) {
  const ws = winStart();
  return EVENTS.filter(x => x.e === ev && x.t >= ws && (!paramKey || (x.p || '').indexOf('"'+paramKey+'":"'+paramVal+'"') >= 0)).length;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function bucket(t) {
  const d = new Date(t);
  if (curGran === 'hour') return ts(t) + ' ' + pad2(d.getHours()) + ':00';
  if (curGran === 'day' || curGran === 'month' || curGran === 'year') {
    if (curGran === 'month') return d.getFullYear() + '-' + pad2(d.getMonth()+1);
    if (curGran === 'year') return String(d.getFullYear());
    return ts(t);
  }
  // week：归到本周一
  const w = new Date(d); const day = (w.getDay() === 0 ? 7 : w.getDay()); w.setDate(w.getDate() - day + 1);
  return '周:' + w.getFullYear() + '-' + pad2(w.getMonth()+1) + '-' + pad2(w.getDate());
}
function parseP(p) { try { return JSON.parse(p || '{}'); } catch (e) { return {}; } }

async function load() {
  const [dj, cj] = await Promise.all([
    fetch('/api/data').then(r => r.json()),
    fetch('/coords.json').then(r => r.json())
  ]);
  if (!dj.ok) { document.getElementById('meta').textContent = '数据加载失败：' + dj.error; return; }
  EVENTS = dj.events || []; COORDS = cj || { events: {}, pages: [] };
  document.getElementById('meta').textContent = '共 ' + dj.count + ' 条 · 更新于 ' + new Date().toLocaleTimeString();
  const sel = document.getElementById('eventSel');
  sel.innerHTML = Object.keys(cj.events).map(e => '<option value="' + e + '">' + cj.events[e] + '（' + e + '）</option>').join('');
  if (curEvent) sel.value = curEvent; else curEvent = sel.value;
  renderTabs(); renderShot(); renderChart();
}

function renderTabs() {
  document.getElementById('pageTabs').innerHTML = (COORDS.pages || []).map((p, i) =>
    '<button class="btn' + (i === curPage ? ' active' : '') + '" onclick="curPage=' + i + ';renderTabs();renderShot()">' + p.title + '</button>').join('');
}

function renderShot() {
  const area = document.getElementById('shotArea');
  const page = (COORDS.pages || [])[curPage];
  if (!page || !page.marks || page.marks.length === 0) {
    area.innerHTML = '<img src="/screenshots/' + (page ? page.img : '') + '" style="max-height:520px"><div class="empty" style="position:absolute;top:8px;left:8px">本页坐标标注待填（coords.json marks）</div>';
    return;
  }
  let html = '<img src="/screenshots/' + page.img + '" style="max-height:520px">';
  page.marks.forEach(m => {
    const c = count(m.event, m.pkey, m.pval);
    html += '<div class="mark' + (c === 0 ? ' zero' : '') + '" style="left:' + (m.x * 100) + '%;top:' + (m.y * 100) + '%" title="' + (COORDS.events[m.event] || m.event) + '" onclick="jumpTo(\'' + m.event + '\')">' + (m.label || '') + ' ' + c + '</div>';
  });
  area.innerHTML = html;
}

function jumpTo(ev) { curEvent = ev; document.getElementById('eventSel').value = ev; renderChart(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }

function renderChart() {
  curEvent = document.getElementById('eventSel').value;
  const evs = EVENTS.filter(x => x.e === curEvent);
  // 汇总卡片
  const today = ts(Date.now());
  const st = (label, n) => '<span class="stat">' + label + '<b>' + n + '</b></span>';
  document.getElementById('stats').innerHTML =
    st('总计', evs.length) + st('今天', evs.filter(x => ts(x.t) === today).length) +
    st('近7天', evs.filter(x => x.t >= Date.now() - 7*864e5).length) +
    st('近30天', evs.filter(x => x.t >= Date.now() - 30*864e5).length);
  // 参数分色（取首参数键，取值集合≤6 才分色）
  const pkeys = {}; evs.forEach(x => { const p = parseP(x.p); const k = Object.keys(p)[0]; if (k) pkeys[k] = (pkeys[k] || new Set()).add ? (pkeys[k] || new Set()) : pkeys[k]; });
  let pkey = null, pvals = [];
  const k0 = Object.keys(pkeys)[0];
  if (k0) {
    const set = new Set(evs.map(x => parseP(x.p)[k0]).filter(v => v !== undefined));
    if (set.size > 1 && set.size <= 6) { pkey = k0; pvals = [...set]; }
  }
  // 聚合
  const buckets = {};
  evs.forEach(x => { const b = bucket(x.t); (buckets[b] = buckets[b] || []).push(x); });
  const bkeys = Object.keys(buckets).sort();
  const series = [];
  if (!pkey) {
    series.push({ name: (COORDS.events[curEvent] || curEvent), type: 'bar', barMaxWidth: 40,
      data: bkeys.map(b => buckets[b].length), itemStyle: { color: '#6c4fe0', borderRadius: [4,4,0,0] } });
  } else {
    const colors = ['#6c4fe0', '#3fa7a0', '#c78a3d', '#b0567a', '#5a8a3d', '#7a7ad0'];
    pvals.forEach((v, i) => series.push({ name: v, type: 'bar', stack: 'x', barMaxWidth: 40,
      data: bkeys.map(b => buckets[b].filter(x => parseP(x.p)[pkey] === v).length),
      itemStyle: { color: colors[i % colors.length] } }));
  }
  chart.setOption({
    tooltip: { trigger: 'axis' }, legend: pkey ? { textStyle: { color: '#cfc2f5' } } : undefined,
    grid: { left: 40, right: 16, top: pkey ? 40 : 24, bottom: 28 },
    xAxis: { type: 'category', data: bkeys, axisLabel: { color: '#8a7fa8', rotate: bkeys.length > 8 ? 38 : 0, fontSize: 10 } },
    yAxis: { type: 'value', minInterval: 1, axisLabel: { color: '#8a7fa8' }, splitLine: { lineStyle: { color: '#342a52' } } },
    series: series
  }, true);
}

function setWin(w) { curWin = w; document.querySelectorAll('[data-win]').forEach(b => b.classList.toggle('active', b.dataset.win === w)); renderShot(); }
function setGran(g) { curGran = g; document.querySelectorAll('[data-g]').forEach(b => b.classList.toggle('active', b.dataset.g === g)); renderChart(); }
window.addEventListener('resize', () => chart.resize());
load();
</script>
</body>
</html>
